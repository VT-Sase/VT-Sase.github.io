# Runs on every pull request and every push to main.
#
# The job name below ("Lint & Build") is the status check the Webmaster
# selects under Settings -> Branches when requiring checks to pass. If you
# rename this job, update that branch protection rule too.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only run the newest commit on a branch. If you push twice in a row, the
# first run is cancelled instead of both sitting in the queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Build
        run: npm run build
